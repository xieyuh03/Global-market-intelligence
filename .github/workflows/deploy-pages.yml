name: Deploy public site

on:
  push:
    branches: [main, refresh-request]
  schedule:
    # 19:30 Asia/Shanghai, after exchange ETF scale data is normally available.
    - cron: "30 11 * * 1-5"
    # 08:30 Asia/Shanghai on the following morning, after final T+1 scale updates.
    - cron: "30 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh public market snapshot
        run: npm run data:refresh-market

      - name: Refresh index volatility research
        id: volatility_refresh
        continue-on-error: true
        run: npm run research:volatility

      - name: Verify index volatility snapshot
        env:
          REFRESH_OUTCOME: ${{ steps.volatility_refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            echo "::warning::Live volatility refresh failed; deploying the last verified complete snapshot."
          fi
          node --input-type=module <<'NODE'
          import { readFile, stat } from "node:fs/promises";

          const root = "public/data/volatility-analysis";
          const ids = ["sp500", "nasdaq-composite", "shanghai-composite", "csi300"];
          const summary = JSON.parse(await readFile(`${root}/summary.json`, "utf8"));
          if (summary.indices?.length !== ids.length || summary.indices.some((item) => item.observations < 1_000)) {
            throw new Error("Volatility summary is incomplete");
          }
          for (const id of ids) {
            for (const directory of ["raw", "derived"]) {
              if ((await stat(`${root}/${directory}/${id}.csv`)).size === 0) throw new Error(`${directory}/${id}.csv is empty`);
            }
          }
          NODE

      - name: Refresh index deviation research
        run: npm run research:deviation

      - name: Refresh broad ETF flow
        id: etf_flow_refresh
        if: github.event_name != 'push' || github.ref == 'refs/heads/refresh-request'
        timeout-minutes: 15
        run: npm run research:etf-flow

      - name: Verify broad ETF flow snapshot
        env:
          ALLOW_STALE_SNAPSHOT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          REFRESH_OUTCOME: ${{ steps.etf_flow_refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            echo "::warning::Live ETF flow refresh failed; validating whether the last complete snapshot is still fresh enough to deploy."
          fi
          node --input-type=module <<'NODE'
          import { readFile, stat } from "node:fs/promises";

          const root = "public/data/etf-flow";
          const payload = JSON.parse(await readFile(`${root}/broad-etf-flow.json`, "utf8"));
          if (!payload.asOf || payload.coverage?.funds < 500 || payload.daily?.length < 2 || payload.categories?.length < 5) throw new Error("ETF flow snapshot is incomplete");
          const referenceDates = (await readFile("public/data/deviation-analysis/daily/shanghai-composite.csv", "utf8"))
            .split(/\r?\n/)
            .slice(1)
            .map((line) => line.slice(0, 10))
            .filter((date) => /^\d{4}-\d{2}-\d{2}$/.test(date));
          const minimumFreshDate = referenceDates.at(-2) ?? referenceDates.at(-1);
          if (process.env.ALLOW_STALE_SNAPSHOT !== "true" && (!minimumFreshDate || payload.asOf < minimumFreshDate)) {
            throw new Error(`ETF flow snapshot is stale: ${payload.asOf}; expected ${minimumFreshDate} or later`);
          }
          if (payload.daily.some((row) => row.date >= payload.coverage.fullMarketStartDate && (row.status !== "complete" || row.exchanges?.length !== 2))) throw new Error("ETF aggregate contains partial dates inside the full-market period");
          for (const id of ["all-a", "broad", "industry", "hong-kong", "gold", "bond"]) {
            if (!payload.categories.some((category) => category.id === id)) throw new Error(`Missing ETF category: ${id}`);
          }
          if (payload.segments?.length !== 18 || !payload.daily.at(-1)?.observedCategories?.length) throw new Error("ETF decision-useful taxonomy is incomplete");
          for (const file of ["etf-flow-dashboard.json", "daily.csv", "category-daily.csv", "segment-daily.csv", "fund-daily.csv", "universe.csv"]) {
            if ((await stat(`${root}/${file}`)).size === 0) throw new Error(`${file} is empty`);
          }
          const csi300 = JSON.parse(await readFile(`${root}/indices/csi-300.json`, "utf8"));
          if (csi300.points?.length < 1_000) throw new Error("CSI 300 overlay history is incomplete");
          NODE

      - name: Persist refreshed snapshots
        if: github.event_name != 'push' || github.ref == 'refs/heads/refresh-request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Published data is already current"
            exit 0
          fi
          git commit -m "data: refresh public snapshots [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Refresh Hang Seng leading indicator
        id: hk_leading_refresh
        continue-on-error: true
        run: npm run research:hk-leading

      - name: Verify Hang Seng leading indicator snapshot
        env:
          REFRESH_OUTCOME: ${{ steps.hk_leading_refresh.outcome }}
        run: |
          if [ "$REFRESH_OUTCOME" != "success" ]; then
            echo "::warning::Live Hang Seng indicator refresh failed; deploying the last verified complete snapshot."
          fi
          node --input-type=module <<'NODE'
          import { readFile, stat } from "node:fs/promises";

          const root = "public/data/hk-leading-indicator";
          const payload = JSON.parse(await readFile(`${root}/summary.json`, "utf8"));
          if (payload.series?.length < 90 || payload.coverage?.observations < 80) throw new Error("Hang Seng leading indicator history is incomplete");
          if (payload.latest?.components?.length !== 4 || payload.horizonStats?.length !== 4) throw new Error("Hang Seng leading indicator summary is incomplete");
          const now = new Date();
          const currentMonthOrdinal = now.getUTCFullYear() * 12 + now.getUTCMonth();
          const monthOrdinal = (value) => {
            const [year, month] = value.split("-").map(Number);
            return year * 12 + month - 1;
          };
          if (currentMonthOrdinal - monthOrdinal(payload.coverage.lastCompositeDate) > 2) throw new Error(`Hang Seng composite is stale: ${payload.coverage.lastCompositeDate}`);
          if (monthOrdinal(payload.coverage.lastHsiDate) < currentMonthOrdinal - 1) throw new Error(`Hang Seng monthly close is stale: ${payload.coverage.lastHsiDate}`);
          for (const file of ["summary.json", "components.csv", "components.json", "daily.json", "monthly.csv", "source-cache.json"]) {
            if ((await stat(`${root}/${file}`)).size === 0) throw new Error(`${file} is empty`);
          }
          NODE

      - name: Validate and export site
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4